name: Daily cyber digest

on:
  schedule:
    # GitHub retarde souvent les crons (parfois de plusieurs heures) : on déclenche plusieurs fois
    # (6 h à 9 h UTC). Le garde-fou ci-dessous n'envoie qu'un seul digest par jour, après 8 h à Paris.
    - cron: "17 6-9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Garde-fou (après 8 h Paris, un seul digest par jour)
        id: gate
        run: |
          hour=$(TZ=Europe/Paris date +%H)
          today=$(TZ=Europe/Paris date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ $((10#$hour)) -lt 8 ] || [ -f "digests/$today.md" ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Générer et envoyer le digest
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python -m digest.main
      - name: Sauvegarder la mémoire et l'archive
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/seen.json digests/
          git diff --cached --quiet || (git commit -m "chore: digest du $(date -u +%F)" && git push)
