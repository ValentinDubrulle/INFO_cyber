# Sources et réglages du digest.
feeds:
  - name: CERT-FR
    url: https://www.cert.ssi.gouv.fr/feed/
  - name: CISA
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
  - name: BleepingComputer
    url: https://www.bleepingcomputer.com/feed/
  - name: The Hacker News
    url: https://feeds.feedburner.com/TheHackersNews
  - name: Krebs on Security
    url: https://krebsonsecurity.com/feed/

kev:
  enabled: true
  url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json

settings:
  window_hours: 24          # ne garder que les articles publiés dans cette fenêtre
  kev_window_days: 2        # le KEV n'a qu'une date (sans heure)
  seen_retention_days: 30   # durée de mémoire des articles déjà vus
  max_items: 60             # plafond d'articles envoyés à Gemini
  words_min: 3000           # cible basse du digest
  words_max: 6000           # cible haute du digest
  batch_size: 8             # articles par appel (moins d appels = consignes moins répétées)
  # Fournisseurs de modèles, essayés dans l'ordre. Un fournisseur dont le secret est absent
  # est ignoré ; si aucun ne répond, un digest de secours (titres + extraits + liens) est envoyé.
  providers:
    - name: Gemini
      type: gemini
      key_env: GEMINI_API_KEY
      thinking_level: low                # limite la « réflexion » facturée comme de la sortie (low = économique)
      models: [gemini-3.8-flash, gemini-3.5-flash-lite]
    - name: Mistral                      # palier gratuit "Experiment" : https://console.mistral.ai
      type: openai
      base_url: https://api.mistral.ai/v1
      key_env: MISTRAL_API_KEY
      models: [mistral-small-latest]
    - name: Groq                         # palier gratuit : https://console.groq.com
      type: openai
      base_url: https://api.groq.com/openai/v1
      key_env: GROQ_API_KEY
      models: [openai/gpt-oss-120b, llama-3.3-70b-versatile]
  send_hour_paris: 8
